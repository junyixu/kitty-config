# BEGIN_KITTY_FONTS
font_size 10.0
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
symbol_map U+007E JetBrainsMono Nerd Font
# END_KITTY_FONTS

# 选中即复制 (按需)
# copy_on_select clipboard

# scrollback 默认 2000 太小
scrollback_lines 20000

shell_integration enabled
cursor_blink_interval 0
enable_audio_bell no
enabled_layouts tall:bias=70;full_size=1,stack
resize_in_steps yes
include ./theme.conf
allow_remote_control yes
listen_on unix:/tmp/kitty
term xterm-kitty
# wayland_titlebar_color system
tab_bar_edge top

## 关于区分 <Tab> / <C-i>
# kitty keyboard protocol 由终端原生支持, 无需 kitty.conf 开关:
#   - CSI > 1 u : push, 启用 disambiguate (ESC -> \e[27u, Ctrl+letter -> CSI u)
#   - CSI < u   : pop
#   - 主屏 / alt-screen 模式栈独立
#
# 但仅靠 protocol 不能在 nvim 里区分 <C-i> / <Tab>:
# vim/nvim key model 内部把 <C-i> 归一化为 <Tab>, keymap 层永远拿不到独立的 <C-i>.
# 真正的方案: 在 kitty.conf 里把 ctrl+i 重映射成一条 vim 不识别的 escape 序列 (见下方 \eOI),
# 让 nvim / zsh 直接绑定该 raw 序列, 绕开 keystroke 归一化.
#
# 也不要在 zsh 里 push protocol, 会让 Ctrl+c / Ctrl+d 全失效 (zsh 没全套 CSI u 绑定).
map alt+h no_op
map alt+j no_op
map alt+k no_op
map alt+l no_op

# map kitty_mod+1 kitty_shell window
map kitty_mod+home move_window_to_top
map kitty_mod+f5 load_config_file

map ctrl+g>h neighboring_window left
map ctrl+g>j neighboring_window down
map ctrl+g>k neighboring_window up
map ctrl+g>l neighboring_window right

map ctrl+g>s launch --location=hsplit --cwd=current
map ctrl+g>v launch --location=vsplit --cwd=current
map kitty_mod+\ launch --location=vsplit --cwd=current

# Explicit `zsh`: for ssh windows new_window_with_cwd copies the whole kitten ssh
# cmdline, so a window started with KITTY_SI_RUN_COMMAND_AT_STARTUP=nvi would open
# nvi again. Passing a command makes the remote run it instead of evaling that var.
# Cost: no shell integration in the new window. See sessions/Notes.md.
map kitty_mod+enter new_window_with_cwd zsh
map kitty_mod+t new_tab_with_cwd
map kitty_mod+n new_os_window_with_cwd
map kitty_mod+alt+t new_tab
map kitty_mod+alt+n new_os_window

map ctrl+g>z toggle_layout stack
map ctrl+alt+l goto_layout tall
map ctrl+alt+p last_used_layout

map ctrl+g>w close_window
map ctrl+g>enter new_window
map ctrl+g>r start_resizing_window

map ctrl+g>q close_tab
map ctrl+g>g send_text all \x07
map ctrl+g>ctrl+g send_text all \x07
map ctrl+g>[ scroll_to_prompt -1
map ctrl+g>] scroll_to_prompt 1

map ctrl+g>c copy_to_clipboard
map ctrl+g>p paste_from_clipboard
map kitty_mod+space>u open_url_with_hints
# map kitty_mod+f focus_visible_window
# map kitty_mod+x swap_with_window
map kitty_mod+f2     set_tab_title
map kitty_mod+alt+f2     edit_config_file

map alt+shift+1 goto_tab 1
map alt+shift+2 goto_tab 2
map alt+shift+3 goto_tab 3
map alt+shift+4 goto_tab 4
map alt+shift+5 goto_tab 5
map alt+shift+6 goto_tab 6
map alt+shift+7 goto_tab 7
map alt+shift+8 goto_tab 8
map alt+shift+9 goto_tab 9
map alt+shift+p goto_tab -1

# 让 <C-i> / <C-m> 发送 \eOI / \eOM (SS3 + 字母),
# nvim 不会归一化成 <Tab> / <CR>, 可真正区分.
# 副作用: 不识别这些序列的程序 (less / man 等) 会把 "OI" / "OM" 字面插入.
# 若想去掉副作用, 注释对应行即可.
map ctrl+i send_text all \x1bOI
map ctrl+m send_text all \x1bOM


# 保留 Shift/Ctrl+Enter 的自定义行为
map shift+enter send_text all \x1b\x0d
# Kitty 扩展键位：Alt+Enter/Alt+Shift+Enter 映射到自定义 CSI-u 序列
map alt+enter send_text all \x1b[9;2u
map alt+shift+enter send_text all \x1b[9002;1u
# map ctrl+shift+enter no_op
map ctrl+enter send_text all \x1b[13;5u

## Tab 管理快捷键
map kitty_mod+d detach_tab                    # 分离当前 tab 到新窗口
map ctrl+f2 detach_window new-tab
map ctrl+f3 detach_window ask



# 未激活标签页的显示格式
tab_title_template "{index}. {title}"
# 已激活标签页的显示格式（通常保持一致或加粗）
active_tab_title_template "{index}. {title}"
# 激活标签页的字体样式为正常（不斜体）
active_tab_font_style   bold
# 非激活标签页也不斜体
inactive_tab_font_style bold
modify_font cell_height 110%

map ctrl+/ send_text all \x1f

action_alias launch_tab launch --cwd=current --type=tab

map kitty_mod+a>c>c launch --type=os-window --cwd=current zsh -c "claude -c 2>/dev/null || claude; exec zsh"
map kitty_mod+a>o>c launch --type=os-window --cwd=current zsh -c "opencode -c 2>/dev/null || opencode; exec zsh"

map kitty_mod+o launch --type=tab ~/.config/kitty/bin/kitty_fzf_tab.sh
map kitty_mod+j launch ~/.config/kitty/bin/kitty_detach_tab_join.sh
map kitty_mod+;>p launch --type=background --cwd=current dolphin .
map kitty_mod+;>s>j launch --type=background kitty --session ~/.config/kitty/sessions/landau.kitty-session
map f7>/ goto_session /home/junyi/.config/kitty/sessions
map f7>s save_as_session --use-foreground-process --base-dir ~/.config/kitty/sessions
map f7>h goto_session ~/.config/kitty/sessions/landau.kitty-session
# Browse and select from the list of active projects defined via goto_session commands
map f7>. goto_session --active-only
map kitty_mod+;>y launch --type=tab --cwd=current yazi
map kitty_mod+p command_palette

# map kitty_mod+p>y launch_tab yazi
# startup_session sessions/landau.kitty-session

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_SCROLLBACK {{{
mouse_map alt+left press ungrabbed mouse_selection drag_or_normal_select
# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
# END_KITTY_SCROLLBACK }}}
