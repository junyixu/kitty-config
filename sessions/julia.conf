# Kitty session file for Julia development
# Save this file to: ~/.config/kitty/sessions/julia.conf

# session 文件
new_tab DevJulia
cd ~/WorkSpace/drafts
layout tall:bias=70;full_size=1

# 启动第一个窗口（zsh）
# launch zsh -c '~/bin/vi test.jl; exec zsh'
launch zsh -c '/bin/nvim test.jl; exec zsh'

# 启动第二个窗口（julia）
launch --location=vsplit --title "REPL" julia --project=.
